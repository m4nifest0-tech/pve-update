name: Update pve-update.sh checksum
on: {push: {branches: [main], paths: ["pve-update.sh"]}}
permissions: {contents: write}
jobs: {update-checksum: {runs-on: ubuntu-latest, steps: [{name: Checkout, uses: actions/checkout@v4}, {name: "Generate SHA256 checksum", run: "sha256sum pve-update.sh > pve-update.sh.sha256"}, {name: "Commit checksum if changed", run: "git config user.name \"github-actions[bot]\" && git config user.email \"github-actions[bot]@users.noreply.github.com\" && (git diff --quiet -- pve-update.sh.sha256 || (git add pve-update.sh.sha256 && git commit -m \"Aggiorna checksum SHA256 di pve-update.sh [skip ci]\" && git push))"}]}}
